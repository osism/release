---
# renovate: datasource=pypi depName=ansible
ansible_version: '13.8.0'
# renovate: datasource=pypi depName=ansible-core
ansible_core_version: '2.20.10'

openstack_version: "2026.2"
openstack_previous_version: "2026.1"

# renovate: datasource=github-tags depName=osism/defaults
defaults_version: 'v0.20261111.0'
# renovate: datasource=github-tags depName=osism/generics
generics_version: 'v0.20261111.0'
# renovate: datasource=github-tags depName=osism/ansible-playbooks
playbooks_version: 'v0.20261111.0'

docker_images:
  # renovate: datasource=docker depName=registry.osism.tech/osism/openstackclient
  openstackclient: '10.6.0'

infrastructure_projects:
  cron:
  dnsmasq:
  fluentd:
  grafana:
  hacluster:
  haproxy:
  httpd:
  iscsid:
