# renovate: datasource=github-tags depName=osism/ansible-playbooks
playbooks_version: 'v0.20261023.0'

docker_images:
  # renovate: datasource=docker depName=registry.osism.tech/osism/openstackclient
  openstackclient: '10.5.0'

